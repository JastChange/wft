name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  m2-ci:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install package with test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Ruff lint
        run: ruff check src tests
      - name: Strict type check
        run: mypy src
      - name: Manifest example validation
        run: |
          python -c "from pathlib import Path; from wft.scripts.manifest import load_manifest; load_manifest(Path('config/manifest.example.yaml'))"
      - name: CLI smoke test
        run: |
          wft --help >/dev/null
          wft admin --help >/dev/null
          wft config --help >/dev/null
          wft inventory --help >/dev/null
          wft scripts --help >/dev/null
          wft run --help >/dev/null
          wft task --help >/dev/null
      - name: Full unit test suite
        run: pytest -q

  dependency-and-secret-audit:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: |
          python -m pip install pip-audit==2.10.1
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
      - name: Dependency audit (fail closed)
        run: pip-audit .
      - name: Secret scan (full history, fail closed)
        run: |
          "$HOME/.local/bin/gitleaks" git --no-banner --redact --log-opts="--all"
