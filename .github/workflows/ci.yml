name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install package with test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Contract schema CI (normal/boundary/error samples)
        run: pytest tests/test_contract_schemas.py tests/test_contract_samples.py -q
      - name: Schema copy drift check
        run: pytest tests/test_schema_sync.py -q
      - name: CLI smoke test
        run: |
          wft --help >/dev/null
          wft inventory check --file config/inventory.example.yaml
          wft script check --file config/scripts.example.yaml
      - name: Full unit test suite
        run: pytest -q

  dependency-and-secret-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
      - name: Dependency audit (fail closed)
        run: pip-audit .
      - name: Secret scan (full history, fail closed)
        run: "$HOME/.local/bin/gitleaks" git --no-banner --redact --log-opts="--all"
