    risk: read_only
    shell: bash
    timeout_sec: 30
    enabled: true
  - name: load-average
    path: ../scripts/load_average.sh
    sha256: 221eaaae18b254fb594c28d942c8723ada77dfc39da786e7176fc14704a91875
    risk: read_only
    shell: bash
    timeout_sec: 30
    enabled: true
