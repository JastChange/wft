# Fake nodes and fake absolute private-key paths only.
nodes:
  - name: node-a
    host: 10.0.0.11
    port: 22
    username: root
    private_key_path: /run/secrets/node-a-key
    os: ubuntu-24.04
    groups: [batch]
    tags: [memory, staging]
    enabled: true
  - name: node-b
    host: 10.0.0.12
    port: 22
    username: ops
    private_key_path: /run/secrets/node-b-key
    os: ubuntu-22.04
    groups: [batch]
    tags: [disk, staging]
    enabled: false
